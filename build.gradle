plugins { id 'base' }

allprojects {
    group = 'dolbunov.andrey.qa'
    version = '1.0-SNAPSHOT'
    repositories { mavenCentral() }
}

subprojects {
    apply plugin: 'java-library'

    configurations { aspectjAgent }
    dependencies {
        api platform("io.qameta.allure:allure-bom:${allureVersion}")
        testImplementation platform("org.junit:junit-bom:${junitVersion}")
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testImplementation 'io.qameta.allure:allure-junit5'
        aspectjAgent "org.aspectj:aspectjweaver:${aspectjVersion}"
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += '-parameters'
        options.release = 17
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        maxParallelForks = 1
        // Состояние внешнего стенда меняется независимо от исходников тестов.
        if (project.name != 'common') outputs.upToDateWhen { false }
        def resultsDirectory = layout.buildDirectory.dir("allure-results/${name}")
        systemProperty 'allure.results.directory', resultsDirectory.get().asFile.absolutePath
        // Можно передать свой JSON-конфиг и разовые настройки из командной строки.
        ['config.file', 'apiUrl', 'webUrl', 'headless', 'browser', 'timeout'].each { key ->
            if (System.getProperty(key) != null) systemProperty key, System.getProperty(key)
        }
        testLogging {
            events 'passed', 'failed', 'skipped'
            exceptionFormat = 'full'
        }
        doFirst {
            delete resultsDirectory
            resultsDirectory.get().asFile.mkdirs()
            jvmArgs "-javaagent:${configurations.aspectjAgent.singleFile.absolutePath}"
            new File(resultsDirectory.get().asFile, 'environment.properties').text =
                    "Java=${System.getProperty('java.version')}\nOS=${System.getProperty('os.name')}\nModule=${project.name}\n"
        }
    }
}

tasks.register('test') { dependsOn subprojects.collect { it.path + ':test' } }
tasks.register('testClasses') { dependsOn subprojects.collect { it.path + ':testClasses' } }
tasks.named('check') { dependsOn subprojects.collect { it.path + ':check' } }
tasks.named('clean') { dependsOn subprojects.collect { it.path + ':clean' } }
tasks.named('assemble') { dependsOn subprojects.collect { it.path + ':assemble' } }
tasks.register('runApiTests') { group = 'verification'; dependsOn ':api-tests:test' }
tasks.register('runUiTests') { group = 'verification'; dependsOn ':ui-tests:test' }
tasks.register('runPageObjectTests') { group = 'verification'; dependsOn ':ui-tests:pageObjectTests' }
tasks.register('runAllureTests') { group = 'verification'; dependsOn 'runApiTests', 'runUiTests' }
tasks.register('runApiSmoke') { group = 'verification'; dependsOn ':api-tests:smoke' }
tasks.register('runUiSmoke') { group = 'verification'; dependsOn ':ui-tests:smoke' }
tasks.register('smoke') { group = 'verification'; dependsOn 'runApiSmoke', 'runUiSmoke' }

configurations { allureCli }
dependencies { allureCli "io.qameta.allure:allure-commandline:${allureVersion}@zip" }
def allureInstallation = layout.buildDirectory.dir('tools/allure')
def resultTask = providers.gradleProperty('allureResultsTask').getOrElse('test')
def apiResults = project(':api-tests').layout.buildDirectory.dir("allure-results/${resultTask}")
def uiResults = project(':ui-tests').layout.buildDirectory.dir("allure-results/${resultTask}")

tasks.register('installAllure', Sync) {
    from { zipTree(configurations.allureCli.singleFile) }
    into allureInstallation
}

tasks.register('allureReport', JavaExec) {
    group = 'reporting'
    description = 'Общий Allure-отчёт из результатов двух тестовых модулей'
    dependsOn 'installAllure'
    mainClass = 'io.qameta.allure.CommandLine'
    def cliHome = allureInstallation.get().dir("allure-${allureVersion}").asFile
    classpath = files(fileTree(new File(cliHome, 'lib')) { include '*.jar' }, new File(cliHome, 'lib/config'))
    environment 'APP_HOME', cliHome.absolutePath
    args 'generate', apiResults.get().asFile.absolutePath, uiResults.get().asFile.absolutePath,
            '--config', new File(cliHome, 'config/allure.yml').absolutePath,
            '--clean', '--single-file', '--lang', 'ru',
            '--output', layout.buildDirectory.dir('reports/allure-report').get().asFile.absolutePath
}

tasks.register('allureReportZip', Zip) {
    group = 'reporting'
    dependsOn 'allureReport'
    archiveFileName = 'allure-report-ui-api.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(layout.buildDirectory.dir('reports/allure-report')) { into 'allure-report' }
    from(apiResults) { into 'allure-results/api' }
    from(uiResults) { into 'allure-results/ui' }
    from('ARCHITECTURE.md')
}
